<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171916">
<title>The Tech Storyteller · XC40 Kamera</title>
<link rel="stylesheet" href="ts.css">
<style>
  .finder { position: relative; flex: 1; min-height: 46vh; border-radius: var(--r); overflow: hidden; background: #0d0e0c;
    outline: 2px solid var(--wall); transition: outline-color .25s; }
  .finder[data-live="1"] { outline-color: var(--lime); }
  .finder::after { content: "LIVE · AES-GCM"; position: absolute; top: 12px; right: 12px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .12em; color: var(--ink); background: var(--lime); padding: 4px 8px; border-radius: 6px; display: none; }
  .finder[data-live="1"]::after { display: block; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hint { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--grey); font-size: 16px; line-height: 1.45; }
  .hint b { color: var(--cream); font-weight: 700; }
  .car { position: absolute; left: 12px; bottom: 12px; }
  .controls { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  details.car-data { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
  details.car-data summary { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; margin-top: 10px; font-family: var(--mono); font-size: 12px; }
  .kv span:nth-child(odd) { color: var(--grey); overflow-wrap: anywhere; }
  .kv span:nth-child(even) { text-align: right; }
  .passenger { display: none; text-align: center; text-decoration: none; }
</style>
</head>
<body>
  <div class="brand">
    <img src="assets/ts_logo_cream.png" alt="The Tech Storyteller">
    <div class="kicker"><b>XC40</b><br>Kamera</div>
    <div class="spacer"></div>
    <span class="pill mono" id="room"></span>
  </div>
  <div class="title" id="state" data-s="idle">Bereit</div>

  <div class="finder" id="finder">
    <video id="video" playsinline muted></video>
    <div class="hint" id="hint"></div>
    <div class="car pill" id="carPill" hidden><span class="dot" id="carDot"></span><span id="carText">Auto nicht verbunden</span></div>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Bildqualität">
      <button data-q="320,240,0.6,8">Schnell</button>
      <button data-q="480,360,0.65,6" aria-pressed="true">Ausgewogen</button>
      <button data-q="640,480,0.7,4">Detail</button>
    </div>
    <div class="row">
      <button class="btn go" id="go">Stream starten</button>
      <button class="btn ghost flip" id="flip" aria-label="Kamera wechseln">Kamera wechseln</button>
    </div>
    <div class="stats" id="stats"></div>
    <a class="btn ghost passenger" id="passenger" href="#">Beifahrer-Ansicht teilen</a>
    <details class="car-data" id="carData" hidden>
      <summary id="carSummary">Fahrzeugdaten</summary>
      <div class="kv" id="kv"></div>
    </details>
  </div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
  const BROKER = new URLSearchParams(location.search).get("broker") || "wss://broker.hivemq.com:8884/mqtt";
  const $ = id => document.getElementById(id);
  const frag = new URLSearchParams(location.hash.slice(1));
  const room = (frag.get("r") || "").toUpperCase();
  const keyB64 = frag.get("k") || "";
  const TOPIC = `alphavant-xc40/${room}`;

  let quality = [480, 360, 0.65, 6];
  let facing = "environment", stream = null, client = null, key = null;
  let live = false, timer = null, busy = false, sent = 0, bytes = 0, lastStat = performance.now(), lastCar = 0;
  const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");

  function setState(text, s) { $("state").textContent = text; $("state").dataset.s = s; }
  function hint(html) { $("hint").innerHTML = html; $("hint").hidden = !html; }

  if (!room || !keyB64) {
    setState("Kein Auto", "error");
    hint("Diese Seite öffnest du über den <b>QR-Code in der Hello-XC40-App</b> im Auto. Er enthält den Verbindungscode.");
    $("go").disabled = true; $("flip").disabled = true;
    return;
  }
  $("room").textContent = "Auto " + room;
  // passenger view: same room + key, travels only in the URL fragment
  const liveUrl = new URL("live.html", location.href); liveUrl.hash = location.hash;
  $("passenger").style.display = "block";
  $("passenger").onclick = async e => {
    e.preventDefault();
    try { if (navigator.share) { await navigator.share({ title: "XC40 live", url: liveUrl.href }); return; } } catch (x) { return; }
    try { await navigator.clipboard.writeText(liveUrl.href); $("passenger").textContent = "Link kopiert"; } catch (x) { location.href = liveUrl.href; }
  };
  hint("Tippe auf <b>Stream starten</b>. Dein Browser fragt einmal nach der Kamera.");
  $("carPill").hidden = false;

  const b64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
  crypto.subtle.importKey("raw", b64u(keyB64), "AES-GCM", false, ["encrypt", "decrypt"]).then(k => key = k)
    .catch(() => { setState("Code ungültig", "error"); hint("Der QR-Code ist beschädigt. Scanne ihn im Auto erneut."); });

  async function seal(buf) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, buf));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }
  async function open(buf) {
    const u = new Uint8Array(buf);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, key, u.slice(12)));
  }

  function connect() {
    client = mqtt.connect(BROKER, { clientId: "xc40-phone-" + Math.random().toString(16).slice(2, 10), clean: true, reconnectPeriod: 2000, keepalive: 30 });
    client.on("connect", () => { client.subscribe(TOPIC + "/car"); if (live) setState("Live", "live"); });
    client.on("reconnect", () => live && setState("Verbinde…", "idle"));
    client.on("error", () => setState("Netzwerkfehler", "error"));
    client.on("message", async (t, payload) => {
      if (!t.endsWith("/car") || !key) return;
      try {
        const msg = JSON.parse(new TextDecoder().decode(await open(payload)));
        lastCar = Date.now();
        renderCar(msg);
      } catch (e) {}
    });
  }
  function renderCar(m) {
    const props = m.props || {};
    const keys = Object.keys(props);
    $("carData").hidden = false;
    $("carSummary").textContent = `Fahrzeugdaten · ${keys.length} von ${m.readable ?? "?"} Werten` +
      (m.depthFps ? ` · Tiefe ${Number(m.depthFps).toFixed(1)} fps` : "");
    const kv = $("kv"); kv.textContent = "";
    const add = (k, v) => { const a = document.createElement("span"), b = document.createElement("span"); a.textContent = k; b.textContent = v; kv.append(a, b); };
    if (m.model) add("Gerät", `${m.model} · Android ${m.android}`);
    if (m.depthMs) add("Tiefenmodell", `${m.depthMs} ms pro Bild`);
    keys.forEach(k => add(k, props[k]));
    if (!keys.length) add("Status", m.error || "Das Auto gibt noch keine Werte frei.");
  }

  setInterval(() => {
    const on = Date.now() - lastCar < 8000;
    $("carDot").classList.toggle("on", on);
    $("carText").textContent = on ? "Auto empfängt" : "Auto nicht verbunden";
  }, 1000);

  // phone orientation (gyro-fused), sent with every frame so the car can build a map
  let ori = null;
  window.addEventListener("deviceorientation", e => {
    if (e.alpha == null) return;
    ori = { a: e.alpha, b: e.beta, g: e.gamma };
  });
  // GPS speed (m/s) as fallback when the car does not share its own speed
  let gps = null, geoId = null;
  function startGps() {
    if (!navigator.geolocation || geoId !== null) return;
    geoId = navigator.geolocation.watchPosition(p => {
      gps = { v: p.coords.speed, t: Date.now() };
    }, () => {}, { enableHighAccuracy: true, maximumAge: 1000 });
  }
  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
    return typeof window.orientation === "number" ? window.orientation : 0;
  }
  async function askMotion() {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (e) {}
  }
  // frame = JPEG + meta JSON + uint16 meta length + "XCF1" (trailer: old car apps just see a JPEG)
  function frame(jpeg, meta) {
    const m = new TextEncoder().encode(JSON.stringify(meta));
    const j = jpeg.byteLength, out = new Uint8Array(j + m.length + 6);
    out.set(new Uint8Array(jpeg), 0); out.set(m, j);
    out.set([m.length >> 8, m.length & 255, 88, 67, 70, 49], j + m.length);
    return out.buffer;
  }

  async function camera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: facing, width: { ideal: quality[0] * 2 }, height: { ideal: quality[1] * 2 } } });
    $("video").srcObject = stream; await $("video").play();
  }

  function tick() {
    clearTimeout(timer);
    if (!live) return;
    timer = setTimeout(tick, 1000 / quality[3]);
    const v = $("video");
    if (busy || !key || !client || !client.connected || !v.videoWidth) return;
    const [w, h, q] = quality, vw = v.videoWidth, vh = v.videoHeight, r = w / h;
    let sw = vw, sh = vw / r; if (sh > vh) { sh = vh; sw = vh * r; }
    canvas.width = w; canvas.height = h;
    ctx.drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, w, h);
    const meta = { t: Date.now(), s: screenAngle(), cam: facing === "environment" ? "back" : "front" };
    if (ori) { meta.a = +ori.a.toFixed(2); meta.b = +ori.b.toFixed(2); meta.g = +ori.g.toFixed(2); }
    if (gps && gps.v != null && Date.now() - gps.t < 4000) meta.v = +gps.v.toFixed(2);
    busy = true;
    canvas.toBlob(async blob => {
      try {
        if (blob) {
          const sealed = await seal(frame(await blob.arrayBuffer(), meta));
          client.publish(TOPIC + "/f", sealed, { qos: 0 });
          sent++; bytes += sealed.length;
        }
      } finally { busy = false; }
      const now = performance.now();
      if (now - lastStat > 1000) {
        $("stats").textContent = `${(sent * 1000 / (now - lastStat)).toFixed(1)} Bilder/s · ${Math.round(bytes / Math.max(sent, 1) / 1024)} KB pro Bild · verschlüsselt`;
        sent = 0; bytes = 0; lastStat = now;
      }
    }, "image/jpeg", q);
  }

  $("go").onclick = async () => {
    if (live) {
      live = false; clearTimeout(timer);
      stream && stream.getTracks().forEach(t => t.stop());
      $("go").textContent = "Stream starten"; $("go").dataset.live = "0"; $("finder").dataset.live = "0";
      setState("Gestoppt", "idle"); $("stats").textContent = "";
      hint("Tippe auf <b>Stream starten</b>, um weiterzumachen.");
      return;
    }
    await askMotion();
    startGps();
    try { await camera(); } catch (e) {
      setState("Keine Kamera", "error");
      hint("Kamerazugriff wurde nicht erlaubt. Erlaube die Kamera in den Browser-Einstellungen und lade die Seite neu.");
      return;
    }
    hint("");
    if (!client) connect();
    live = true; $("go").textContent = "Stream stoppen"; $("go").dataset.live = "1"; $("finder").dataset.live = "1";
    setState(client.connected ? "Live" : "Verbinde…", client.connected ? "live" : "idle");
    tick();
  };
  $("flip").onclick = async () => { facing = facing === "environment" ? "user" : "environment"; if (live) { try { await camera(); } catch (e) {} } };
  document.querySelectorAll(".seg button").forEach(b => b.onclick = async () => {
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    quality = b.dataset.q.split(",").map(Number);
    if (live) { try { await camera(); } catch (e) {} }
  });
  // keep the screen awake while streaming, where supported
  let lock = null;
  document.addEventListener("visibilitychange", async () => { if (live && document.visibilityState === "visible" && navigator.wakeLock) { try { lock = await navigator.wakeLock.request("screen"); } catch (e) {} } });
  $("go").addEventListener("click", async () => { if (navigator.wakeLock) { try { lock = await navigator.wakeLock.request("screen"); } catch (e) {} } });
})();
</script>
</body>
</html>
